name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"
  # Pinned Godot AI release the toolkit is validated against.
  CORE_REF: "bfc264200584ea5823f18356acb164781f57796d"

jobs:
  rendered-preview:
    uses: ./.github/workflows/rendered-preview.yml

  tier1:
    name: Tier 1 / ${{ matrix.os }} / ${{ matrix.script }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The tier-1 steps use `set -o pipefail` and `tee`. windows-latest defaults
        # to PowerShell, which cannot parse them - the editor job hit exactly this
        # when it gained a Windows leg.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The same pure suites tools/test_tier1.ps1 runs locally. One
        # matrix leg per suite so a failure names the suite, and so a suite that
        # only ever ran on a developer's machine still gates the release.
        script:
          - tier1_value_codec
          - tier1_spec_modifiers
          - tier1_fx_specs
          - tier1_graph_builders
          - tier1_spec_json
          - tier1_pose_math
          - tier1_motion_drivers
          - tier1_quality_modifiers
          - tier1_rig_analysis
          - tier1_pose_solver
          - tier1_spine_twist
          - tier1_spine_chain
          - tier1_root_motion
          - tier1_proportions
          - tier1_setup_provenance
          - tier1_motion_space
          - tier1_setup_tree_checker
          - tier1_jump_plan
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4

      - name: Checkout Godot AI (pinned)
        uses: actions/checkout@v4
        with:
          repository: hi-godot/godot-ai
          ref: ${{ env.CORE_REF }}
          path: .ci/godot-ai

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Link addons (Linux)
        if: runner.os == 'Linux'
        run: |
          ln -s "$PWD/.ci/godot-ai/plugin/addons/godot_ai" test_project/addons/godot_ai
          ln -s "$PWD/addons/godot_ai_animation" test_project/addons/godot_ai_animation

      - name: Link addons (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c mklink /J "$PWD\test_project\addons\godot_ai" "$PWD\.ci\godot-ai\plugin\addons\godot_ai"
          cmd /c mklink /J "$PWD\test_project\addons\godot_ai_animation" "$PWD\addons\godot_ai_animation"

      - name: Import project
        run: godot --headless --path test_project --import

      - name: Tier-1 checks
        run: |
          set -o pipefail
          godot --headless --path test_project --script "res://tests/${{ matrix.script }}.gd" 2>&1 | tee tier1.log

      - name: The suite has to have actually run
        if: always()
        run: |
          # A suite that prints nothing and exits 0 is GREEN and tests nothing.
          # Every tier-1 script ends with TIER1 PASS or TIER1 FAIL, so the absence
          # of both means the script never reached its report - a bad res:// path,
          # a parse error, a silent headless no-op - and the exit code alone cannot
          # tell that apart from success. This is the tier-1 twin of the editor
          # job's parse-error gate.
          if [ ! -f tier1.log ]; then
            echo "::error::tier1.log was not written - the suite did not run"
            exit 1
          fi
          if ! grep -q "TIER1 " tier1.log; then
            echo "::error::no TIER1 PASS/FAIL line: res://tests/${{ matrix.script }}.gd never reported"
            grep -c "Parse Error\|SCRIPT ERROR" tier1.log || true
            tail -20 tier1.log
            exit 1
          fi
          grep -q "TIER1 PASS" tier1.log

  editor-suite:
    name: Editor suite / ${{ matrix.os }} / core ${{ matrix.core-ref }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The golden walk fixture is recorded on Windows and was only ever
        # compared on Linux, so the cross-OS axis of the float maths was never
        # exercised. Tier-1 already runs both; the editor suites now do too,
        # because this is the only leg that runs the golden fixtures.
        # Released versions gate; `main` is informational drift detection.
        include:
          - {os: ubuntu-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: windows-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: ubuntu-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
          - {os: windows-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
          - {os: ubuntu-latest, core-ref: "main", core-sha: "main"}
          - {os: windows-latest, core-ref: "main", core-sha: "main"}
    continue-on-error: ${{ matrix.core-ref == 'main' }}
    defaults:
      run:
        # The steps below are bash (`ln -s`, `set -o pipefail`, `tee`, `[ -f ]`).
        # windows-latest defaults to PowerShell, which fails on all four, so the
        # shell is pinned rather than left to the runner image.
        shell: bash
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4

      - name: Checkout Godot AI
        uses: actions/checkout@v4
        with:
          repository: hi-godot/godot-ai
          ref: ${{ matrix.core-sha }}
          path: .ci/godot-ai

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Link addons
        run: |
          ln -s "$PWD/.ci/godot-ai/plugin/addons/godot_ai" test_project/addons/godot_ai
          ln -s "$PWD/addons/godot_ai_animation" test_project/addons/godot_ai_animation

      - name: Import project
        run: godot --headless --path test_project --import

      - name: Run toolkit suites (headless editor)
        env:
          ANIMATION_TOOLKIT_CI: "1"
          GODOT_AI_ALLOW_HEADLESS: "1"
        run: |
          set -o pipefail
          godot --headless --path test_project --editor 2>&1 | tee editor.log

      - name: Fail on parse errors
        if: always()
        run: |
          if [ -f editor.log ] && grep -q "Parse Error" editor.log; then
            echo "GDScript parse errors found:"
            grep -n "Parse Error" editor.log
            exit 1
          fi

      - name: Audit every registry operation
        if: matrix.os == 'ubuntu-latest' && matrix.core-ref == '4.2.1'
        run: |
          godot --headless --path test_project --script res://tools/export_operation_audit.gd
          git diff --exit-code -- docs/operation-audit.json

      - name: Preserve exact-source editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.os }}-${{ matrix.core-ref }}
          path: editor.log

  mcp-route:
    name: Live MCP route / ${{ matrix.os }} / core ${{ matrix.core-ref }}
    runs-on: ${{ matrix.os }}
    # Full saved-history matrices and external reload checks take almost
    # fifteen minutes on Windows; retain room for runner/startup variation.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: windows-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: ubuntu-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
          - {os: windows-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4

      - name: Checkout Godot AI (pinned)
        uses: actions/checkout@v4
        with:
          repository: hi-godot/godot-ai
          ref: ${{ matrix.core-sha }}
          path: .ci/godot-ai

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Godot AI backend
        run: python -m pip install -e .ci/godot-ai

      - name: Link addons
        run: |
          ln -s "$PWD/.ci/godot-ai/plugin/addons/godot_ai" test_project/addons/godot_ai
          ln -s "$PWD/addons/godot_ai_animation" test_project/addons/godot_ai_animation

      - name: Import project
        run: godot --headless --path test_project --import

      - name: Probe families and saved motion, graph, modifier, FX, edit, preset, library, inspect, sequence and rig contracts through Godot AI
        run: |
          set -o pipefail
          python tools/ci_mcp_route.py --core-root .ci/godot-ai --case-output-dir operation-evidence 2>&1 | tee mcp-route.log

      - name: Preserve editor startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-editor-${{ matrix.os }}-${{ matrix.core-ref }}
          path: |
            mcp-editor.log
            mcp-backend.log
            mcp-route.log
            operation-evidence/**
          if-no-files-found: ignore

  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4

      - name: plugin.cfg version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godot_ai_animation/plugin.cfg)
          echo "tag=$tag plugin.cfg=$version"
          [ "$tag" = "$version" ]

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate committed package
        shell: pwsh
        run: ./tools/release_zip.ps1 -Source $env:GITHUB_SHA
      - name: Reject corrupted packages and version/path mismatches
        run: python tools/test_release_package.py
      - name: Reject corrupt and stale operation qualification evidence
        run: python -m unittest discover -s tools -p 'test_release_audit.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*

  dependency-controls:
    name: Dependency and rollback controls / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated metadata and typed registration controls
        shell: bash
        run: python tools/test_core_dependency.py --godot godot

  clean-install:
    name: Clean ZIP install / ${{ matrix.os }} / core ${{ matrix.core-ref }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: windows-latest, core-ref: "4.2.1", core-sha: "bfc264200584ea5823f18356acb164781f57796d"}
          - {os: ubuntu-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
          - {os: windows-latest, core-ref: "4.3.0", core-sha: "b82b5c519b1b17228f70d8effce1626f391bd1dd"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hi-godot/godot-ai
          ref: ${{ matrix.core-sha }}
          path: .ci/godot-ai
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Install exact released backend and download released plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -e .ci/godot-ai
          gh release download "v${{ matrix.core-ref }}" --repo hi-godot/godot-ai --pattern godot-ai-v4-plugin.zip --dir .ci/released-core
      - name: Verify cached-call selection test ordering
        run: python -m unittest discover -s tools -p 'test_install_selection.py' -v
      - name: Qualify both enable orders from extracted ZIPs
        run: |
          python tools/clean_zip_install.py --source "$GITHUB_SHA" --zip dist/godot-ai-animation-toolkit-2.0.0.zip --core-root .ci/godot-ai --core-zip .ci/released-core/godot-ai-v4-plugin.zip --core-ref "${{ matrix.core-ref }}" --output clean-install-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}-${{ matrix.core-ref }}
          path: |
            clean-install-evidence/*-editor.log
            clean-install-evidence/*-route.log
            clean-install-evidence/clean-install-receipt.json
            clean-install-evidence/gate-diagnostics/**

  release-gate:
    # Repair PRs may retain honest pending evidence. Main and tags must close it.
    if: github.event_name == 'push'
    needs: [tier1, editor-suite, mcp-route, version-check, package, clean-install, dependency-controls, rendered-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoded rendered-evidence validator dependency
        run: python -m pip install Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: rendered-preview-linux-core-*
          path: rendered-preview-matrix
      - name: Verify both exact-run rendered preview receipts
        run: python tools/check_rendered_preview_matrix.py --source "$GITHUB_SHA" --receipts rendered-preview-matrix
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-install-*
          path: release-matrix
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Verify exact-source installation matrix
        run: python tools/check_install_matrix.py --source "$GITHUB_SHA" --receipts release-matrix --package dist/godot-ai-animation-toolkit-2.0.0.zip.manifest.json
      - name: Require complete exact-source operation qualification
        run: python tools/check_release_audit.py --source "$GITHUB_SHA" --receipt-dir docs/release-qualification

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Verify package before publication
        run: python tools/validate_release_package.py --source "$GITHUB_SHA" --zip "dist/godot-ai-animation-toolkit-${GITHUB_REF_NAME#v}.zip" --version "${GITHUB_REF_NAME#v}"
      - name: Require tag to identify freshly fetched remote main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Publish ZIP, checksum and source manifest with curated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/godot-ai-animation-toolkit-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.manifest.json" "$archive.sha256" --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/releases/2.0.0.md
