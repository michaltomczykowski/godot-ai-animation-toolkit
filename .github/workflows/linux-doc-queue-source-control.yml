name: Experimental Linux doc queue control

on:
  push:
    branches: [diagnostics/godot-4.7.2-doc-queue]
    paths:
      - .github/workflows/linux-doc-queue-source-control.yml
      - diagnostics/godot-4.7.2-doc-queue.patch
      - diagnostics/replay-doc-queue-preview.sh
      - tools/ci_rendered_preview.py

permissions:
  contents: read

jobs:
  source-control:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ENGINE_SHA: ed1daf0bf001b61586d9930840f2f1394092c079
      PATCH_SHA: 0378c9c898b32606d19547cd076a63b2800763ac4ff3c7e74fb0f7a717c71001
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      # The preview uses OpenGL and no baked lightmaps. Both diagnostic
      # builds omit the optional Embree-backed module that failed to link.
      GODOT_BUILD_PROFILE: 'platform=linuxbsd target=editor arch=x86_64 production=no debug_symbols=yes module_raycast_enabled=no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ed1daf0bf001b61586d9930840f2f1394092c079
          path: .ci/godot
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hi-godot/godot-ai
          ref: b82b5c519b1b17228f70d8effce1626f391bd1dd
          path: .ci/godot-ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Install build and preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxrandr-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libwayland-dev wayland-protocols xvfb xauth mesa-utils \
            libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
          python -m pip install SCons==4.9.1 Pillow==11.3.0 -e .ci/godot-ai
      - name: Verify renderer and isolated attach with official Godot before building
        run: bash diagnostics/replay-doc-queue-preview.sh stock "$(command -v godot)"
      - name: Verify source and baseline build
        run: |
          test "$(git -C .ci/godot rev-parse HEAD)" = "$ENGINE_SHA"
          patch_file="$PWD/diagnostics/godot-4.7.2-doc-queue.patch"
          printf '%s  %s\n' "$PATCH_SHA" "$patch_file" | sha256sum --check
          git -C .ci/godot apply --check "$patch_file"
          cd .ci/godot
          read -ra build_args <<< "$GODOT_BUILD_PROFILE"
          scons "${build_args[@]}" -j3
          mkdir -p "$RUNNER_TEMP/engine-control"
          cp bin/godot.linuxbsd.editor.x86_64 "$RUNNER_TEMP/engine-control/godot-baseline"
      - name: Patched build at the same revision
        run: |
          patch_file="$PWD/diagnostics/godot-4.7.2-doc-queue.patch"
          cd .ci/godot
          git apply "$patch_file"
          read -ra build_args <<< "$GODOT_BUILD_PROFILE"
          scons "${build_args[@]}" -j3
          cp bin/godot.linuxbsd.editor.x86_64 "$RUNNER_TEMP/engine-control/godot-locked"
          for engine in "$RUNNER_TEMP/engine-control"/godot-*; do
            sha256sum "$engine"
            "$engine" --version
          done
      - name: Replay cold rendered preview on both diagnostic builds
        run: |
          status=0
          for variant in baseline locked; do
            engine="$RUNNER_TEMP/engine-control/godot-$variant"
            if ! bash diagnostics/replay-doc-queue-preview.sh "$variant" "$engine"; then
              status=1
            fi
          done
          exit "$status"
      - name: Preserve paired diagnostic logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-doc-queue-diagnostics
          path: |
            ${{ runner.temp }}/preview-results-*/editor.log
            ${{ runner.temp }}/preview-results-*/backend.log
            ${{ runner.temp }}/preview-results-*/*.json
          if-no-files-found: ignore
